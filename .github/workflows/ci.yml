name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ════════════════════════════════════════════════════════════
  # Lint — runs once, fast
  # ════════════════════════════════════════════════════════════
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: dev

      - name: Check formatting and lint
        run: pixi run -e dev lint-check

  # ════════════════════════════════════════════════════════════
  # Spec — translate docs/SPEC.md, validate, report maturity
  # ════════════════════════════════════════════════════════════
  #
  # Gates on SHACL Violations (structural integrity), not Warnings.
  # That split is specl's, and it is data driven rather than configured
  # here: warnings become blocking automatically when docs/SPEC.md
  # declares `status: production`. The spec is `prototype`, so warnings
  # surface in the log and depress the maturity score without failing
  # the build — which is the point of scoring it at all.
  #
  # `spec-gate` (translate --fail-on-warning) is deliberately NOT run
  # yet: four parser warnings are the known specl limitation that it
  # cannot express a urn: vocabulary, so the CGA terms under `governs:`
  # emit as literals. Filed upstream. Switch this job to `spec-gate`
  # once that lands and the count is zero.
  spec:
    name: Spec
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: spec

      - name: Confirm the SHACL processor applies the shapes as intended
        # The shapes use SPARQL-based targets, an optional SHACL feature.
        # A processor without Advanced Features skips them silently rather
        # than erroring, so a broken spec would validate clean. This asserts
        # the gate below is actually running.
        run: pixi run -e spec spec-conformance

      - name: Translate SPEC.md to RDF
        run: pixi run -e spec spec-translate

      - name: Validate against specl shapes
        run: pixi run -e spec spec-validate

      - name: Report maturity and progress
        run: pixi run -e spec spec-score

      - name: Verify the spec still describes the library
        # Reports, does not gate — for now. Two checks fail today and both
        # predate the specl 1.0 adoption: R4.5 (find_path uses a Python BFS
        # where the spec forbids anything but SPARQL) and R8.2 (the Fuseki
        # tests are not marked skip-when-unavailable). Blocking on them here
        # would fail every build for reasons unrelated to the spec tooling.
        # Drop continue-on-error once those two are fixed; the step also
        # catches `implementation:` drift, which is what keeps the Progress
        # score honest, and that half is green.
        continue-on-error: true
        run: pixi run -e spec spec-compliance

  # ════════════════════════════════════════════════════════════
  # Test — matrix across Python versions
  # ════════════════════════════════════════════════════════════
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            pixi-env: py311
            os: ubuntu-latest
          - python: "3.12"
            pixi-env: py312
            os: ubuntu-latest
          - python: "3.13"
            pixi-env: py313
            os: ubuntu-latest
          - python: "3.12"
            pixi-env: py312
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: ${{ matrix.pixi-env }}

      - name: Run tests
        run: pixi run -e ${{ matrix.pixi-env }} test

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.pixi-env }}-${{ matrix.os }}
          path: |
            build/reports/pytest.html
            build/reports/pytest.xunit.xml
            build/reports/coverage.xml
            build/reports/htmlcov/
          retention-days: 14

  # ════════════════════════════════════════════════════════════
  # pip-install — verify the documented onboarding path works in a
  # clean venv (no pixi). Guards README "Tests" section:
  #   pip install .[dev] && pytest
  # The audit found this broken because addopts referenced
  # pytest-html / pytest-json-report, which were absent from [dev].
  # ════════════════════════════════════════════════════════════
  pip-install:
    name: pip install .[dev] + pytest
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create clean venv and install
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run the documented test command
        run: |
          . .venv/bin/activate
          pytest

  # ════════════════════════════════════════════════════════════
  # Docs — build Sphinx (always) + deploy to Pages (if green)
  # ════════════════════════════════════════════════════════════
  docs:
    name: Docs
    runs-on: ubuntu-latest
    # Build docs in parallel with tests — don't wait for them
    if: always()
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: >-
            dev
            spec

      - name: Sync notebooks to JupyterLite content
        run: pixi run -e dev sync_jl

      - name: Build JupyterLite site
        run: pixi run -e dev build_jl

      # Both land in docs/source/_extra/, which Sphinx's html_extra_path
      # copies verbatim to the site root. That publishes the graph at
      # https://zwelz3.github.io/holonic/spec.ttl — the namespace every item
      # IRI in the spec resolves under, so the identifiers dereference
      # instead of merely looking like they would. The badge rides the same
      # mechanism rather than being committed: derived data pushed back into
      # the repo rejects the next push and drifts from the real score.
      - name: Publish the spec graph and maturity badge
        run: |
          pixi run -e spec spec-publish
          pixi run -e spec spec-badge

      - name: Build documentation
        run: pixi run -e dev build_html_docs

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: build/docs/
          retention-days: 14

  # ════════════════════════════════════════════════════════════
  # Deploy docs — only after tests pass on main
  # ════════════════════════════════════════════════════════════
  deploy-docs:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [test, docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs
          path: build/docs/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

  # ════════════════════════════════════════════════════════════
  # Build — sdist + wheel (runs on every push/PR)
  # ════════════════════════════════════════════════════════════
  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install flit build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify package
        run: |
          pip install dist/*.whl twine
          VERSION=$(python -c "import holonic; print(holonic.__version__)")
          echo "Built holonic ${VERSION}"
          # Wheel + sdist metadata must be well-formed (long-description
          # render, classifiers, etc.) before we ever reach PyPI.
          twine check dist/*
          # On a tagged build, the git tag and __version__ must agree. This
          # is the gate that would have caught the 0.7.1 artifact mismatch
          # (see CHANGELOG); a bare `import` print never could.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            if [[ "${TAG}" != "${VERSION}" ]]; then
              echo "::error::tag v${TAG} does not match __version__ ${VERSION}"
              exit 1
            fi
            echo "tag v${TAG} matches __version__ ${VERSION}"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30

  # ════════════════════════════════════════════════════════════
  # Publish — push to PyPI on tagged releases
  # ════════════════════════════════════════════════════════════
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write  # trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/p/holonic

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses trusted publishing — configure at:
        # https://pypi.org/manage/project/holonic/settings/publishing/
        with:
          # A re-run of a partially-published tag must not hard-fail on
          # files PyPI already has (PyPI releases are immutable).
          skip-existing: true
