# Read the Docs configuration for holonic
#
# Builds the Sphinx documentation and embeds a JupyterLite static
# site under `/jupyterlite/` so readers can try the example notebooks
# in their browser without installing anything.
#
# Reference: https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    # Before Sphinx runs, build the JupyterLite site into the Sphinx
    # _extra tree so that Sphinx's html_extra_path copies it verbatim
    # into the output root at /jupyterlite/index.html. The build tooling
    # is pinned inline below; nothing is preinstalled into Pyodide, so the
    # notebooks install holonic themselves at runtime.
    pre_build:
      - pip install "jupyterlite-core>=0.4" "jupyterlite-pyodide-kernel>=0.4" "jupyterlab>=4,<5" "notebook>=7,<8"
      - python scripts/sync_notebooks_to_jlite.py
      - mkdir -p docs/source/_extra
      - cd jupyterlite && jupyter lite build --output-dir ../docs/source/_extra/jupyterlite

sphinx:
  configuration: docs/source/conf.py
  # Kept false deliberately. The audit's "toctree drops core docs" finding is
  # fixed by including SPEC/DECISIONS/MIGRATION/CHANGELOG as first-class pages
  # (docs/source/{spec,decisions,migration,changelog}.md) and is guarded by a
  # deterministic test (test_docs_structure.py), NOT by -W. Turning this on
  # would fail the build on the large pre-existing content-formatting warning
  # class those now-rendered docs emit (definition-list/indentation/underline
  # nits), which is out of scope for the 0.8.0 audit-remediation release.
  fail_on_warning: false

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
