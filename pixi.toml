[workspace]
name = "holonic"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

# ──────────────────────────────────────────────────────────
# Environment layout
#
# pixi features are composable units of (dependencies | tasks).
# They assemble into environments. Two everyday environments:
#
#   dev   — the default for development. Library + lint + test +
#           docs + jupyterlite + lab. Does NOT pull specl.
#   spec  — layered over a subset of dev with specl from PyPI.
#           Use when working on docs/SPEC.md:
#             pixi run -e spec spec-validate
#             pixi run -e spec spec-score
#             pixi run -e spec spec-badge
#
# Specl is kept out of dev so day-to-day work doesn't resolve it
# on every install. It's optional infrastructure for spec-driven
# development, not required for the library itself.
# ──────────────────────────────────────────────────────────

[pypi-dependencies]
holonic = { path=".", editable=true}
yfiles-jupyter-graphs = ">=1.7.0,<3"
sphinx_autodoc_typehints = "*"
sphinx_rtd_theme = "*"

[dependencies]
python = ">=3.11"
pip = ">=25"
polars = "*"
rdflib = ">=7.0.0,<8"
pyshacl = ">=0.26.0"
jinja2 = ">=3.1.0"
python-docx = ">=1.0.0"
jupytext = "*"
# networkx backs the 12_holarchy_viz example notebook; declaring it here
# (and in the [viz] extra) means `pixi run test` executes that notebook
# instead of the runner skipping it for a missing optional dep.
networkx = ">=3"


# generic tasks ###########################################
[tasks]

[tasks.lint-fix]
description = """Run all lint fixers"""
depends-on = ["clean-notebooks", "fix-pyproject", "fix-ssort", "format-ruff", "fix-ruff"]
cmd = "echo 🚧"

[tasks.lint-check]
description = """Run all lint checkers"""
depends-on = ["check-pyproject", "check-ssort", "check-ruff", "check-mypy", "check-notebooks"]
cmd = "echo 🔎"

[feature.tasks-test.tasks]

[feature.tasks-test.tasks.test]
depends-on = ["test-unit", "test-notebooks"]
cmd = "echo ✅ All tests passed"

[feature.tasks-test.tasks.test-unit]
description = "Run the pytest suite."
cmd = "pytest"

[feature.tasks-test.tasks.test-integration]
description = "Boot dockerized Apache Jena Fuseki, run the --integration suite against it end-to-end, then tear the container down. Requires Docker."
cmd = "python scripts/run_fuseki_integration.py"
inputs = [
  "docker-compose.fuseki.yml",
  "scripts/run_fuseki_integration.py",
  "src/holonic/backends/**/*.py",
  "src/holonic/test/test_fuseki_integration.py",
]

[feature.tasks-test.tasks.test-notebooks]
description = "Execute every notebook's code cells and fail on errors. Skips Jupyter-specific cells (magic commands, top-level await)."
cmd = "python scripts/test_notebooks.py"
inputs = ["notebooks/*.ipynb", "scripts/test_notebooks.py", "src/holonic/**/*.py"]

[feature.tasks-lint.tasks.clean-notebooks]
description = """Strip all outputs from notebooks in place. Runs first in lint-fix so any stray committed cell outputs are removed before the Python formatters touch anything."""
cmd = "jupyter nbconvert --clear-output --inplace notebooks/*.ipynb"
inputs = ["notebooks/*.ipynb"]

[feature.tasks-lint.tasks.check-notebooks]
description = """Fail if any notebook has cell outputs. Uses --stdout to a throwaway comparison instead of modifying the files. Notebook outputs should never be committed; they bloat diffs and leak data."""
cmd = "python scripts/check_notebooks.py"
inputs = ["notebooks/*.ipynb", "scripts/check_notebooks.py"]

[feature.tasks-lint.tasks.fix-pyproject]
cmd = "pyproject-fmt pyproject.toml"
inputs = ["pyproject.toml"]

[feature.tasks-lint.tasks.fix-ssort]
cmd = "ssort src/**/*.py"
inputs = ["src/**/*.py"]

[feature.tasks-lint.tasks.format-ruff]
cmd = "ruff format src src/**/*.py"
inputs = ["src/**/*.py"]

[feature.tasks-lint.tasks.fix-ruff]
cmd = "ruff check src/ --fix"
inputs = ["src/**/*.py"]

[feature.tasks-lint.tasks.check-mypy]
cmd = "mypy --show-error-codes -p holonic"
inputs = ["src/**/*.py", "pyproject.toml"]

[feature.tasks-lint.tasks.check-pyproject]
cmd = "pyproject-fmt pyproject.toml --check"
inputs = ["pyproject.toml"]

[feature.tasks-lint.tasks.check-ssort]
cmd = "ssort --check src/**/*.py"
inputs = ["src/**/*.py"]

[feature.tasks-lint.tasks.check-ruff]
cmd = "ruff check src/"
inputs = ["src/**/*.py"]

# Spec-driven development via specl #################
# Translates docs/SPEC.md to RDF, validates against the SHACL shapes shipped
# with specl, and reports two independent numbers: maturity (how completely
# the spec is written) and progress (how much of it is built, rolled up from
# per-item `implementation:` annotations). Maturity is the fraction of
# specl:Item instances with zero SHACL violations or warnings, priority
# weighted. Useful as a CI gate and as a published badge.
#
# The shapes argument is omitted throughout: specl 1.0 resolves its own
# bundled shapes.ttl. The previous `python -c 'import specl ...'` shim is
# gone because specl 1.0 states its modules have no supported public API —
# it is a CLI, and reaching into the package to locate a data file was
# depending on something it does not promise to keep.
[feature.tasks-spec.tasks.spec-translate]
description = "Translate docs/SPEC.md to docs/SPEC.ttl via specl. Parser warnings print but do not gate; use spec-gate for the strict form."
cmd = "specl-translate docs/SPEC.md docs/SPEC.ttl"
inputs = ["docs/SPEC.md"]
outputs = ["docs/SPEC.ttl"]

[feature.tasks-spec.tasks.spec-gate]
description = """The strict translate CI runs. Fails on any parser warning, which is what keeps a dropped section or an unresolvable reference from passing unnoticed — the failure mode specl 1.0 warns about is content silently not reaching the graph."""
cmd = "specl-translate docs/SPEC.md docs/SPEC.ttl --fail-on-warning"
inputs = ["docs/SPEC.md"]
outputs = ["docs/SPEC.ttl"]

[feature.tasks-spec.tasks.spec-validate]
description = "Validate docs/SPEC.ttl against specl shapes with explanations"
cmd = "specl-validate validate docs/SPEC.ttl --explain"
depends-on = ["spec-translate"]

[feature.tasks-spec.tasks.spec-conformance]
description = """Check that the installed SHACL processor actually applies specl's shapes as intended. The shapes use SPARQL-based targets and constraints, an optional SHACL feature: a processor lacking Advanced Features fails silently rather than erroring, so a defective spec would appear clean. Expect 7 findings, 7 expected."""
cmd = "specl-validate conformance"

[feature.tasks-spec.tasks.spec-diff]
description = """Diff two spec graphs, reporting added, removed and changed items. Pass --ignore-base to compare across a spec_base change, which keys by identifier token rather than IRI. Usage: pixi run -e spec spec-diff -- old.ttl new.ttl --ignore-base"""
cmd = "specl-validate diff"

[feature.tasks-spec.tasks.spec-compliance]
description = "Run the comprehensive SPEC compliance check — verifies each requirement against actual library behavior (not just annotation coverage)"
cmd = "python scripts/spec_compliance_check.py"
inputs = ["docs/SPEC.md", "src/holonic/**/*.py", "scripts/spec_compliance_check.py"]

[feature.tasks-spec.tasks.spec-score]
description = """Report maturity and progress. Maturity (0-100%) is the priority-weighted fraction of items with no SHACL violation or warning — how completely the spec is written. Progress is rolled up from per-item `implementation:` annotations — how much of it is built. They are separate numbers on purpose: a fully written spec of an unbuilt library scores 100% maturity and 0% progress, and collapsing them would hide that."""
cmd = "specl-validate score docs/SPEC.ttl"
depends-on = ["spec-translate"]

[feature.tasks-spec.tasks.spec-history]
description = """Append an assessment to docs/spec-history.ttl as a specl:MaturityAssessment. Release cadence, run by hand — NOT wired into CI. One number cannot show whether a spec is converging; a series can, but only at a granularity where movement means something.

Pass --at with the release date so the entry is deterministic and reproducible:
  pixi run -e spec spec-history -- --at 2026-09-01T00:00:00Z

Why not CI. The history is append-only and must be committed to persist, so a CI job would have to push the file back — which rejects the next push and drifts, the same argument that keeps the badge published rather than committed. The difference is that a badge is regenerable and a history is not, so it is kept, just written deliberately. Appending is idempotent as a graph (the assessment IRI derives from the timestamp, so re-running with the same --at yields identical triples that collapse on parse) but not in the file, which grows a duplicate text block each time. One entry per release keeps it readable."""
cmd = "specl-validate score docs/SPEC.ttl --history docs/spec-history.ttl"
depends-on = ["spec-translate"]

[feature.tasks-spec.tasks.spec-badge]
description = """Render the maturity badge into the Sphinx extra-files tree, from where html_extra_path publishes it to the site root. Not committed: a badge is derived data, and committing it means every scoring run must be pushed back — which rejects the next push and leaves the committed copy drifting from the real score."""
cmd = "mkdir -p docs/source/_extra/badges && specl-validate badge docs/SPEC.ttl --out docs/source/_extra/badges/spec.svg --link https://github.com/zwelz3/holonic/blob/main/docs/SPEC.md"
depends-on = ["spec-translate"]

[feature.tasks-spec.tasks.spec-publish]
description = """Stage docs/SPEC.ttl into the Sphinx extra-files tree so it publishes at https://zwelz3.github.io/holonic/spec.ttl — the namespace every item IRI resolves under. The '.ttl' extension is load-bearing: GitHub Pages serves it as text/turtle, and an extensionless file would not be."""
cmd = "mkdir -p docs/source/_extra && cp docs/SPEC.ttl docs/source/_extra/spec.ttl"
depends-on = ["spec-translate"]
inputs = ["docs/SPEC.ttl"]
outputs = ["docs/source/_extra/spec.ttl"]

[feature.tasks-docs.tasks.autogen]
description = "Autobuild the code documentation"
cmd = "sphinx-apidoc -f -o ./docs/source/auto ./src/holonic ./src/holonic/test"

[feature.tasks-docs.tasks.build_html_docs]
description = "Build the documentation"
cmd = "sphinx-build -a -E -b html ./docs/source ./build/docs"
depends-on = ["autogen"]

[feature.tasks-start.tasks.first]
description = "Set up and test"
depends-on = ["lint-check", "test", "build_html_docs"]

[feature.tasks-jlite.tasks.build_jl]
description = "Build the JupyterLite static site into docs/source/_extra/jupyterlite so Sphinx html_extra_path picks it up"
cmd = "mkdir -p ../docs/source/_extra && jupyter lite build --output-dir ../docs/source/_extra/jupyterlite"
cwd = "jupyterlite"
inputs = [
  "jupyterlite/content/*.ipynb",
  "jupyterlite/jupyter_lite_config.json",
  "jupyterlite/jupyter-lite.json",
]
outputs = ["docs/source/_extra/jupyterlite/index.html"]

[feature.tasks-jlite.tasks.sync_jl]
description = "Copy the latest example notebooks into jupyterlite/content so the next JupyterLite build serves them"
cmd = "python scripts/sync_notebooks_to_jlite.py"
inputs = ["notebooks/*.ipynb"]
outputs = [
  "jupyterlite/content/01_holon_basics.ipynb",
  "jupyterlite/jupyter-lite.json",
]

[feature.tasks-lab.tasks.serve]
description = "Serve local jupyterlab"
cmd = "jupyter lab"


[environments.dev]
features = [
  "deps-lint",
  "deps-test",
  "deps-docs",
  "deps-jlite",
  "deps-lab",
  "tasks-lint",
  "tasks-test",
  "tasks-docs",
  "tasks-start",
  "tasks-jlite",
  "tasks-lab",
]

# Specl environment: layered on top of dev. Only resolves the
# specl git dependency when this environment is materialized.
# Usage: `pixi run -e spec spec-validate`. Add `--frozen` if you want
# to skip re-resolving on every invocation.
[environments.spec]
features = [
  "deps-lint",
  "deps-test",
  "deps-docs",
  "deps-spec",
  "tasks-lint",
  "tasks-test",
  "tasks-spec",
]


[environments.py311]
features  = [
  "py311",
  "deps-lint",
  "deps-test",
  "deps-docs",
  "tasks-lint",
  "tasks-test",
]

[environments.py312]
features  = [
  "py312",
  "deps-lint",
  "deps-test",
  "deps-docs",
  "deps-jlite",
  "tasks-lint",
  "tasks-test",
  "tasks-docs",
  "tasks-jlite",
]

[environments.py313]
features  = [
  "py313",
  "deps-lint",
  "deps-test",
  "deps-docs",
  "tasks-lint",
  "tasks-test",
]

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.deps-lint.dependencies]
mypy = "*"
pyproject-fmt = ">=2.5"
ruff = ">=0.6"
ssort = ">=0.12"
nbconvert = "*"
nbformat = "*"

[feature.deps-spec.pypi-dependencies]
# specl: RDF-native spec validation. 1.0 is the first full PyPI delivery;
# the git pin before it resolved to 0.2.0, two graph contracts behind.
# Capped below 2.0 because the graph contract (owl:versionIRI
# https://w3id.org/specl/shapes/2) may only change in a breaking release,
# and docs/SPEC.md is authored against contract 2.
specl = ">=1.0,<2"

[feature.deps-test.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-html = "*"
pytest-xdist = "*"
pytest-json-report = "*"
# The `test-notebooks` task executes notebooks through nbclient against the
# `python3` kernelspec, which only exists if ipykernel is installed. It used
# to arrive transitively — via jupyterlab in `dev`, and via nbconvert in
# `deps-lint` for nbclient/nbformat — so the py311/py313 CI environments
# (neither `deps-lab` nor `deps-jlite`) had no kernel and every notebook
# failed with `NoSuchKernel` before executing a cell. `test-notebooks` lives
# in `tasks-test`, so its dependencies belong here.
ipykernel = "*"
nbclient = "*"
nbformat = "*"
# aiohttp is a runtime dependency of the Fuseki backend. Without it every
# Fuseki test hits `pytest.importorskip("aiohttp")` and silently skips, so
# the backend shipped at 0% coverage. Installing it here un-skips them.
aiohttp = ">=3.9"

[feature.deps-test.pypi-dependencies]
# Mock aiohttp responses so the Fuseki backend's retry/error/loop handling
# can be unit-tested without a live server (conda-forge has no aioresponses).
aioresponses = "*"

[feature.deps-docs.dependencies]
myst-parser = "*"
pydata-sphinx-theme = "*"
sphinx = ">=7"

[feature.deps-lab.dependencies]
jupyterlab = ">=4,<5"
ipydatagrid = "*"

[feature.deps-jlite.dependencies]
jupyterlite-core = "*"
jupyterlite-pyodide-kernel = "*"
jupyterlab = ">=4,<5"