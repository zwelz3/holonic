[build-system]
build-backend = "flit_core.buildapi"
requires = [
  "flit-core>=3.7.1,<4",
]

[project]
name = "holonic"
description = "Graph-native holonic RDF systems"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Zach Welz", email = "welz.zach@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = [
  "version",
]
dependencies = [
  "pyshacl>=0.25",
  # Cap rdflib below 8 explicitly. pyshacl currently enforces this bound
  # transitively, but the library binds directly against rdflib 7 APIs
  # (Dataset default_union, initBindings term semantics), so declare it
  # here rather than inheriting an implicit ceiling (audit: rdflib pin).
  "rdflib>=7,<8",
]
optional-dependencies.dev = [
  # Include the full test extra so a bare `pytest` works out of the box:
  # the default addopts reference pytest-html / pytest-json-report, which
  # ship in [test]. Keeping them out of [dev] made `pip install .[dev] &&
  # pytest` fail on unknown --html / --json-report options.
  "holonic[docs,entailment,fuseki,notebooks,test,viz]",
  "ruff",
]
optional-dependencies.docs = [
  "myst-parser",
  "sphinx>=7",
  "sphinx-autodoc-typehints",
  "sphinx-rtd-theme",
]
optional-dependencies.entailment = [
  "owlrl>=6",
]
optional-dependencies.fuseki = [
  "aiohttp>=3.9",
]
optional-dependencies.lint = [
  "mypy",
  "pyproject-fmt>=2.5",
  "ruff>=0.6",
  "ssort>=0.12",
]
optional-dependencies.notebooks = [
  "jupyter",
  "jupytext>=1.16",
]
optional-dependencies.test = [
  "pytest",
  "pytest-cov",
  "pytest-html",
  "pytest-json-report",
  "pytest-xdist",
]
optional-dependencies.viz = [
  "ipywidgets>=8",
  "networkx>=3",
  "yfiles-jupyter-graphs>=1.7",
]
scripts.holonic-migrate-registry = "holonic.cli.migrate_registry:main"
entry-points."holonic.projections".localize_predicates = "holonic.projections:localize_predicates"
# First-party projection transforms. Third-party packages register
# their own transforms under this group in their pyproject.toml;
# pipelines reference them by the entry-point name (left side).
entry-points."holonic.projections".strip_blank_nodes = "holonic.projections:strip_blank_nodes"

[tool.flit]
sdist.exclude = [
  ".gitignore",
]

[tool.ruff]
line-length = 100
cache-dir = "build/.ruff_cache"
format.docstring-code-line-length = 100
lint.select = [
  "D",
  "E",
  "F",
  "I",
  "PLE",
  "PLW",
  "UP",
]
lint.ignore = [
  "D105",
  "D107",
  "D205",
]
lint.per-file-ignores."src/holonic/test/__*.py" = [
  "D",
]
lint.per-file-ignores."src/holonic/test/test*.py" = [
  "D",
]
lint.pydocstyle.convention = "google"

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
allow_redefinition = true
disable_error_code = "type-abstract"
cache_dir = "build/.mypy_cache"
sqlite_cache = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "importlib.metadata",
]
ignore_missing_imports = true

# numpy is not a holonic dependency; mypy only reaches it transitively
# (holonic.viz -> IPython, which is py.typed and imports numpy). Its
# stubs use PEP 695 `type` statements, which mypy reports as a syntax
# error while python_version targets 3.11 — and a syntax error aborts
# the whole run. Skip following numpy rather than dropping 3.11 as the
# check target. follow_imports_for_stubs is required: without it the
# skip is not applied to numpy's inline .pyi files, which is where the
# error is raised. Revisit when 3.11 support is dropped (python/mypy#21178).
[[tool.mypy.overrides]]
module = [
  "numpy",
  "numpy.*",
]
follow_imports = "skip"
follow_imports_for_stubs = true

# Tests are exempt from strict-typing noise (missing annotations etc.).
[[tool.mypy.overrides]]
module = [
  "holonic.test.*",
]
disallow_untyped_defs = false
check_untyped_defs = false
ignore_errors = true

# ── mypy ratchet ────────────────────────────────────────────────────
# These modules still carry legacy mypy errors and are ignored until the
# audit-remediation phase that owns each one cleans it. As a module goes
# green, DELETE its entry here so mypy guards it permanently thereafter.
# Already cleaned and now guarded: backends.rdflib_backend, plugins.
[[tool.mypy.overrides]]
module = [
  "holonic._console",
  "holonic._pipelines",
  "holonic.backends._fuseki_client",
  "holonic.backends.fuseki_backend",
  "holonic.client",
  "holonic.model",
  "holonic.projections",
  "holonic.viz.graph_builder",
  "holonic.viz.provenance",
  "holonic.viz.widgets",
]
ignore_errors = true

[tool.pytest]
ini_options.addopts = [
  "--pyargs",
  "holonic",
  # for contributors
  "--cov-report=term-missing:skip-covered",
  "--color=yes",
  # for review
  "--html=build/reports/pytest.html",
  "--self-contained-html",
  "--cov-report=html:build/reports/htmlcov",
  "--cov-report=xml:build/reports/coverage.xml",
  "--cov-context=test",
  # coverage
  "--cov=holonic",
  "--no-cov-on-fail",
  # for robots
  "--junitxml=build/reports/pytest.xunit.xml",
  "--json-report",
  # misc
  "-vv",
  "--ff",
]
ini_options.junit_family = "xunit2"
ini_options.cache_dir = "build/.pytest_cache"

[tool.coverage]
run.data_file = "build/reports/.coverage"
run.omit = [
  "*/holonic/utils.py",
  "*/test/test*.py",
]
paths.holonic = [
  "src/holonic",
  "*/src/holonic",
]
report.exclude_also = [
  "except LookupError",
  "except RuntimeError",
  "except TypeError",
  "raise NotImplementedError*",
  "raise TypeError",
]
html.show_contexts = true
